<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Development | GHOSECORP</title>
    <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #f0f0f0;
            --accent-color: #00f2ff;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Orbitron', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-family: 'Michroma', sans-serif;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 20px;
            font-size: 2.5rem;
        }
        p {
            max-width: 600px;
            margin-bottom: 40px;
            line-height: 1.6;
            color: #ccc;
        }
        .back-btn {
            padding: 12px 30px;
            border: 2px solid var(--accent-color);
            color: var(--text-color);
            text-decoration: none;
            font-family: 'Michroma', sans-serif;
            text-transform: uppercase;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .back-btn:hover {
            background: var(--accent-color);
            color: #111;
        }
    </style>
</head>
<body>
    <h1>Software Development</h1>
    <p>Detailed insights for our Software Development services are on the way. GHOSECORP provides custom, scalable software solutions built with the latest technologies.</p>
    <a href="../../" class="back-btn">Back to Home</a>
</body>
</html>
